<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <div class="spacing">
            <header>
                <div class="logo">
                    <a href="#">
                        <img src="Logo.png" alt="">
                    </a>
                </div>

                <div class="nav">
                    <a href="#">Home</a>
                    <a href="#">Service</a>
                    <a href="#">Feature</a>
                    <a href="#">Product</a>
                    <a href="#">Testimonial</a>
                    <a href="#">FAQ</a>

                <div class="auth">
                    <a class="login" href="#">Login</a>
                    <a class="signup" href="#">Sign up</a>
                </div>

                <input type="checkbox" id="burger-menu-checkbox">
                <label for="burger-menu-checkbox" class="burger-menu-icon">
                    <p class="line-one"></p>
                    <p class="line-two"></p>
                    <p class="line-three"></p>

                <div class="burger-menu">
                    <a href="#">Home</a>
                    <a href="#">Service</a>

            <main>
                <section class="home">
                    <section class="hero-section">
                        <div class="hero-content">
                            <div class="hero-text">
                                <h1>Lessons and insights <span>from 8 years</span></h1>
                                <p>Where to grow your business as a photographer: site or social media?</p>
                            </div>
                            <a href="#">Register</a>
                        </div>

                        <div class="hero-img">
                            <img src="Illustration.png" alt="">
                        </div>

                        <div class="dots">
                            <button></button>
                            <button></button>
                            <button></button>
                        </div>
                    </section>

                    <section class="clients">
                        <div class="clinets-text">
                            <h2>Our Clinets</h2>
                            <p>We have been working with some Fortune 500+ clients</p>
                        </div>
                        <div class="clients-logobar">
                            <div>
                                <img src="clients-logos/Logo(0).png" alt="">
                            </div>
                            <div>
                                <img src="clients-logos/Logo (1).png" alt="">
                            </div>
                            <div>
                                <img src="clients-logos/Logo (2).png" alt="">
                            </div>
                            <div>
                                <img src="clients-logos/Logo (3).png" alt="">
                            </div>
                            <div>
                                <img src="clients-logos/Logo (4).png" alt="">
                            </div>
                            <div>
                                <img src="clients-logos/Logo (5).png" alt="">
                            </div>
                            <div>
                                <img src="clients-logos/Logo (6).png" alt="">
                            </div>
                        </div>

                </section>

            </main>
